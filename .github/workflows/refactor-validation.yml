name: Refactor validation

on:
  push:
    branches:
      - refactor/orders-customers-products
      - refactor/employee-shifts-transfers
      - refactor/role-specific-interfaces
      - refactor/final-audit-cleanup
      # Keep the role-specific admin shell and panel access policy under CI.
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refactor-validation-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit and regression tests
        run: bunx vitest run

      - name: Lint extracted feature modules
        run: >-
          bunx eslint
          src/components/admin/EmployeeTransfersTable.tsx
          src/components/admin/EmployeeWorkFormatters.ts
          src/lib/bybit-account.server.ts
          src/lib/bybit-assets.server.ts
          src/lib/bybit-card-mapper.ts
          src/lib/bybit-cards.server.ts
          src/lib/bybit-convert.server.ts
          src/lib/bybit-runtime.ts
          src/lib/work-pin.server.ts
          src/components/admin/panels/CourseLessonsManager.tsx
          src/components/admin/panels/CoursesTab.tsx
          src/lib/bybit-account.functions.ts
          src/lib/bybit-read.functions.ts
          src/lib/bybit-card-admin.functions.ts
          src/lib/bybit-convert.functions.ts
          src/lib/bybit-ledger.functions.ts
          src/lib/bybit-card-visibility.ts
          src/lib/bybit-card-visibility.test.ts
          src/lib/bybit-cache.server.ts
          src/lib/bybit-card-api.server.ts
          src/lib/bybit-overview.server.ts
          src/lib/bybit-card-sync.server.ts
          src/lib/bybit-ledger-write.server.ts
          src/lib/bybit-ledger-sync.server.ts
          src/lib/bybit-concurrency.server.ts
          src/lib/bybit.server.ts
          src/lib/work-overview.functions.ts
          src/lib/work-employee.functions.ts
          src/lib/work-admin.functions.ts
          src/lib/work-access.server.ts
          src/lib/work-shared.server.ts
          src/lib/work-analytics.server.ts
          src/lib/work-p2p.server.ts
          src/lib/work-transfers.server.ts
          src/lib/admin-panel-access.ts
          src/lib/admin-panel-access.test.ts
          src/lib/admin-navigation.ts
          src/lib/use-admin-role.ts
          src/components/admin/AdminSidebar.tsx
          src/components/admin/AdminPanelContent.tsx
          src/components/admin/EmployeePanelContent.tsx
          src/routes/_authenticated/admin.tsx
          src/components/admin/EmployeePickerMenu.tsx
          src/components/admin/ShiftPickerMenu.tsx
          src/components/admin/WorkSheetPickers.tsx
          src/components/admin/WorkSheetPanel.tsx
          src/components/admin/EmployeeTransactionCells.tsx
          src/components/admin/EmployeeManualCards.tsx
          src/components/admin/EmployeeManualTransactions.tsx
          src/components/admin/EmployeeWorkTables.tsx
          src/components/admin/EmployeeWorkView.tsx
          src/components/admin/panels/EmployeesTab.tsx
          src/lib/employee-avatar.ts
          src/lib/work-employee.server.ts
          src/lib/work-manual.server.ts
          src/lib/work-history.server.ts
          src/lib/work.server.ts
          src/lib/admin-access.server.ts
          src/lib/admin-employees.functions.ts
          src/lib/admin.functions.ts
          src/lib/admin-operations.functions.ts
          src/lib/admin-customers.functions.ts
          src/lib/admin-orders.functions.ts
          src/lib/categories.functions.ts
          src/lib/categories-write.functions.ts
          src/lib/products.functions.ts
          src/lib/orders.functions.ts
          src/lib/orders-create.functions.ts
          src/lib/orders-payment.functions.ts
          src/lib/orders-read.functions.ts
          src/lib/orders-admin.queries.ts
          src/lib/customer-summary.server.ts
          src/lib/customer-summary.server.test.ts
          src/lib/read-pages.server.ts
          src/lib/products.queries.ts
          src/lib/categories.queries.ts
          src/components/admin/panels/CategoriesTab.tsx
          src/routes/index.tsx
          src/routes/shop.tsx
          'src/routes/category.$slug.tsx'
          'src/routes/product.$slug.tsx'
          src/components/admin/ProductsTab.tsx
          src/lib/courses-access.server.ts
          src/lib/courses-device.functions.ts
          src/lib/courses-access.functions.ts
          src/lib/mail/access.server.ts
          src/lib/mail-core.functions.ts
          src/lib/mail-read.functions.ts
          src/lib/mail-compose.functions.ts
          src/lib/mail-notifications.functions.ts
          src/components/admin/panels/OverviewTab.tsx
          src/components/admin/panels/CustomersTab.tsx
          src/components/admin/panels/ReviewsTab.tsx
          src/components/admin/panels/OrdersTab.tsx
          --rule 'prettier/prettier: off'
          --rule '@typescript-eslint/no-explicit-any: off'
          --rule '@typescript-eslint/no-unused-vars: error'

      - name: Audit unused files, exports, and dependencies
        run: bunx knip --no-progress

      - name: Type-check TypeScript
        run: bunx tsc --noEmit
      - name: Build production bundle
        run: bun run build
