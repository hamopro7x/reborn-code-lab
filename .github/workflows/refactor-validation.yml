name: Refactor validation

on:
  push:
    branches:
      - "refactor/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refactor-validation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit and regression tests
        run: bunx vitest run

      - name: Lint changed source files
        shell: bash
        run: |
          git fetch origin main
          FILES="$(git diff --name-only origin/main...HEAD -- '*.ts' '*.tsx' | grep -v '^src/routeTree.gen.ts
      - name: Build production bundle
        run: bun run build
 || true)"
          if [ -n "$FILES" ]; then
            printf '%s\n' "$FILES" | xargs -r bunx eslint
          else
            echo "No changed TypeScript source files to lint."
          fi

      - name: Build production bundle
        run: bun run build
