name: Refactor validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refactor-validation-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit and regression tests
        run: bunx vitest run

      - name: Lint newly extracted work modules
        run: >-
          bunx eslint
          src/components/admin/EmployeeTransfersTable.tsx
          src/components/admin/EmployeeWorkFormatters.ts
          --rule 'prettier/prettier: off'
          --rule '@typescript-eslint/no-explicit-any: off'

      - name: Build production bundle
        run: bun run build
