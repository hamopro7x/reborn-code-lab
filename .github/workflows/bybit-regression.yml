name: Bybit regression tests

on:
  pull_request:
    paths:
      - "src/lib/bybit*"
      - "src/lib/work-assign.server.ts"
      - ".github/workflows/bybit-regression.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Card status, reversal, mirror and ledger regressions
        run: bunx vitest run

      - name: Lint Bybit modules
        run: >-
          bunx eslint
          src/lib/bybit-access.ts
          src/lib/bybit-account.server.ts
          src/lib/bybit-account.functions.ts
          src/lib/bybit-assets.server.ts
          src/lib/bybit-card-api.server.ts
          src/lib/bybit-card-records.ts
          src/lib/bybit-card-records.test.ts
          src/lib/bybit-card-mapper.ts
          src/lib/bybit-card-sync.server.ts
          src/lib/bybit-cards.server.ts
          src/lib/bybit-card-visibility.ts
          src/lib/bybit-card-visibility.test.ts
          src/lib/bybit-concurrency.server.ts
          src/lib/bybit-convert.functions.ts
          src/lib/bybit-ledger-sync.server.ts
          src/lib/bybit-ledger-write.server.ts
          src/lib/bybit-ledger.functions.ts
          src/lib/bybit-overview.server.ts
          src/lib/bybit-read.functions.ts
          src/lib/bybit-runtime.ts
          src/lib/bybit-spend.ts
          src/lib/bybit-value-helpers.ts
          src/lib/bybit-value-helpers.test.ts
          src/lib/bybit.server.ts
          --rule 'prettier/prettier: off'
          --rule '@typescript-eslint/no-explicit-any: off'
      - name: Type-check TypeScript
        run: bunx tsc --noEmit
      - name: Build production bundle
        run: bun run build
