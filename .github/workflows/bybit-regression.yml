name: Bybit regression tests

on:
  pull_request:
    paths:
      - "src/lib/bybit*"
      - "src/lib/work-assign.server.ts"
      - ".github/workflows/bybit-regression.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Card status, reversal, mirror and ledger regressions
        run: bunx vitest run
