name: Bybit regression tests

on:
  pull_request:
    paths:
      - "src/lib/bybit*"
      - "src/lib/work-assign.server.ts"
      - "src/lib/work.functions.ts"
      - "src/lib/work.server.ts"
      - "src/lib/face-*"
      - "src/lib/work-client.ts"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/bybit-regression.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Card status, reversal, mirror and ledger regressions
        run: bunx vitest run
      - name: ESLint (changed source files)
        run: |
          files=$(git diff --name-only --diff-filter=ACMRT origin/main...HEAD -- '*.ts' '*.tsx' '*.js' '*.jsx' | grep -v -E 'src/lib/(bybit.functions|work.functions|password.functions).ts' || true)
          if [ -n "$files" ]; then
            echo "$files" | xargs -r bunx eslint
          fi
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
 || true)
          if [ -n "$files" ]; then
            echo "$files" | xargs -r bunx eslint
          fi
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Production build
        run: bun run build
