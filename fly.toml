app = 'm-hamo'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3000'
  HOST = '0.0.0.0'
  NODE_ENV = 'production'

[[services]]
  internal_port = 3000
  protocol = 'tcp'
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
