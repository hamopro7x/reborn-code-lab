<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>MAG PRO — مشاركة الشاشة</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: radial-gradient(circle at 50% 0%, #1e293b, #0f172a 60%);
        color: #e5e7eb;
      }
      .card {
        width: 380px;
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 20px;
        padding: 28px;
        text-align: center;
      }
      h1 { font-size: 18px; margin: 0 0 4px; }
      .hint { font-size: 13px; color: #94a3b8; margin: 0 0 18px; }
      .code {
        font-family: Consolas, monospace;
        font-size: 38px;
        letter-spacing: 8px;
        font-weight: 800;
        color: #3b82f6;
        direction: ltr;
        margin: 8px 0 4px;
      }
      .status { font-size: 13px; color: #cbd5e1; margin: 12px 0 18px; }
      .dot {
        display: inline-block;
        width: 8px; height: 8px; border-radius: 50%;
        background: #64748b; margin-inline-end: 6px;
      }
      .dot.on { background: #22c55e; }
      button {
        width: 100%; padding: 12px; border: 0; border-radius: 12px;
        background: #3b82f6; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
      }
      button:disabled { background: #334155; cursor: default; }
      video { width: 100%; border-radius: 12px; margin-top: 16px; background: #000; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>مشاركة الشاشة مع الإدارة</h1>
      <p class="hint">هذا الكود يُعطى للمدير لمشاهدة شاشتك</p>
      <div class="code" id="code">------</div>
      <div class="status"><span class="dot" id="dot"></span><span id="status">لم تبدأ المشاركة</span></div>
      <button id="start">بدء المشاركة</button>
      <video id="preview" muted autoplay playsinline></video>
    </div>
    <script src="share.js"></script>
  </body>
</html>
