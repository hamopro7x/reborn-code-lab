services:
  app:
    build:
      context: ..
      dockerfile: selfhost/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    # مناسب لـVPS بـ2 vCPU / 8GB: نترك هامشًا للنظام وللكرون
    mem_limit: 4g
    cpus: 1.5
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/public/build-version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # كرون على سيرفرك يستدعي مزامنة Bybit بدل pg_cron داخل السحابة
  bybit-cron:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    env_file: .env
    environment:
      SYNC_URL: "http://app:3000/api/public/hooks/bybit-ledger-sync"
      SYNC_INTERVAL_SECONDS: "${SYNC_INTERVAL_SECONDS:-300}"
      SYNC_TIMEOUT_SECONDS: "${SYNC_TIMEOUT_SECONDS:-120}"
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./sync-loop.sh:/sync-loop.sh:ro
    # السر يُقرأ من env فقط (SYNC_HOOK_SECRET) ولا يوجد fallback لمفتاح عام
    command: sh -c "apk add --no-cache curl >/dev/null && sh /sync-loop.sh"
